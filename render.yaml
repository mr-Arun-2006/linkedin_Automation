services:
  - type: web
    name: linkedin-whatsapp-control
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn whatsapp_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GNEWS_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ADMIN_PHONE
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0
      - key: WHATSAPP_STATE_DB
        value: data/whatsapp_state.db
