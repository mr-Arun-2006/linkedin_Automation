services:
  - type: web
    name: linkedin-telegram-control
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn telegram_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GNEWS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_USER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: REMOTE_STATE_DB
        value: data/remote_state.db
